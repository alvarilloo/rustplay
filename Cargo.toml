[workspace]
resolver = "2"
members = ["crates/core", "crates/rx", "crates/tx", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
rustplay-core = { path = "crates/core" }
rustplay-rx = { path = "crates/rx" }
rustplay-tx = { path = "crates/tx" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.12"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
plist = "1.10"
rand = "0.10"
uuid = { version = "1.29", features = ["v4"] }
ed25519-dalek = "3.0"
windows = "0.62"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
