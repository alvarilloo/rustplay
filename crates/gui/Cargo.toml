[package]
name = "rustplay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RustPlay: duplicación de pantalla y audio para Windows"

[[bin]]
name = "RustPlay"
path = "src/main.rs"

[dependencies]
rustplay-core.workspace = true
rustplay-rx.workspace = true
rustplay-tx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
plist.workspace = true
serde_json = "1.0"
sha2 = "0.11"

[dependencies.windows]
workspace = true
features = [
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Data_Xml_Dom",
    "Foundation",
    "UI",
    "UI_Notifications",
    "UI_ViewManagement",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_Storage_Xps",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Networking_NetworkListManager",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-numerics]
version = "0.3"

[build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true
